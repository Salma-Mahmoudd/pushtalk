ke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="212.1191" x="619.74" y="144.4795">password_hash : varchar(255)</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="152.4414" x="619.74" y="160.7764">-- argon2id via pwdlib</text><ellipse cx="610.74" cy="173.7266" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="274.6475" x="619.74" y="177.0732">created_at : timestamptz default now()</text></g><!--class rt--><g class="entity" data-entity="rt" data-source-line="18" data-uid="ent0003" id="entity_rt"><rect fill="#F1F1F1" height="294.75" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="455.2832" x="50.3" y="244.3769"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="103.7764" x="226.0534" y="262.372">refresh_tokens</text><line style="stroke:#181818;stroke-width:0.5;" x1="51.3" x2="504.5832" y1="270.6738" y2="270.6738"/><ellipse cx="61.3" cy="284.3222" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="96.1201" x="70.3" y="287.6689">id : uuid &#171;PK&#187;</text><line style="stroke:#181818;stroke-width:1;" x1="51.3" x2="504.5832" y1="294.9706" y2="294.9706"/><ellipse cx="61.3" cy="308.6191" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="348.5029" x="70.3" y="311.9657">user_id : uuid &#171;FK users.id&#187; ON DELETE CASCADE</text><ellipse cx="61.3" cy="324.9159" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="107.126" x="70.3" y="328.2626">family_id : uuid</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="339.124" x="70.3" y="344.5595">-- one family per login (= session id, "sid" claim)</text><ellipse cx="61.3" cy="357.5097" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.0703" x="70.3" y="360.8564">token_hash : char(64) &#171;UNIQUE&#187;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="429.2832" x="70.3" y="377.1532">-- SHA-256 of the opaque token; raw token only in the cookie</text><ellipse cx="61.3" cy="390.1034" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="274.6475" x="70.3" y="393.4501">created_at : timestamptz default now()</text><ellipse cx="61.3" cy="406.4003" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3779" x="70.3" y="409.747">expires_at : timestamptz</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.4189" x="70.3" y="426.0439">rotated_at : timestamptz</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="313.2773" x="70.3" y="442.3407">replaced_by_id : uuid &#171;FK refresh_tokens.id&#187;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="179.8672" x="70.3" y="458.6376">revoked_at : timestamptz</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="182.7656" x="70.3" y="474.9345">user_agent : varchar(255)</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="53.2588" x="70.3" y="491.2314">ip : inet</text><line style="stroke:#181818;stroke-width:1;" x1="51.3" x2="504.5832" y1="498.5331" y2="498.5331"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="122.1787" x="56.3" y="515.5282">INDEX (family_id)</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="109.5049" x="56.3" y="531.8251">INDEX (user_id)</text></g><!--class members--><g class="entity" data-entity="members" data-source-line="38" data-uid="ent0004" id="entity_members"><rect fill="#EEEEEE" height="91.1875" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="184.1289" x="558.88" y="346.1569"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="128.8369" x="586.526" y="364.152">channel_members</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="114.0234" x="593.9327" y="380.4489">(owned by chat)</text><line style="stroke:#181818;stroke-width:0.5;" x1="559.88" x2="742.0089" y1="388.7506" y2="388.7506"/><ellipse cx="569.88" cy="402.3991" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="158.1289" x="578.88" y="405.7457">channel_id : uuid &#171;FK&#187;</text><ellipse cx="569.88" cy="418.6959" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="133.2666" x="578.88" y="422.0426">user_id : uuid &#171;FK&#187;</text><line style="stroke:#181818;stroke-width:0.5;" x1="559.88" x2="742.0089" y1="429.3444" y2="429.3444"/></g><!--class messages--><g class="entity" data-entity="messages" data-source-line="43" data-uid="ent0005" id="entity_messages"><rect fill="#EEEEEE" height="91.1875" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="176.7666" x="777.56" y="346.1569"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="70.2119" x="830.8373" y="364.152">messages</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="114.0234" x="808.9316" y="380.4489">(owned by chat)</text><line style="stroke:#181818;stroke-width:0.5;" x1="778.56" x2="953.3266" y1="388.7506" y2="388.7506"/><ellipse cx="788.56" cy="402.3991" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="96.1201" x="797.56" y="405.7457">id : uuid &#171;PK&#187;</text><ellipse cx="788.56" cy="418.6959" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="150.7666" x="797.56" y="422.0426">sender_id : uuid &#171;FK&#187;</text><line style="stroke:#181818;stroke-width:0.5;" x1="778.56" x2="953.3266" y1="429.3444" y2="429.3444"/></g><!--class channels--><g class="entity" data-entity="channels" data-source-line="48" data-uid="ent0006" id="entity_channels"><rect fill="#EEEEEE" height="91.1875" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="186.7607" x="989.56" y="346.1569"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="62.6924" x="1051.5942" y="364.152">channels</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="114.0234" x="1025.9287" y="380.4489">(owned by chat)</text><line style="stroke:#181818;stroke-width:0.5;" x1="990.56" x2="1175.3207" y1="388.7506" y2="388.7506"/><ellipse cx="1000.56" cy="402.3991" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="96.1201" x="1009.56" y="405.7457">id : uuid &#171;PK&#187;</text><ellipse cx="1000.56" cy="418.6959" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="160.7607" x="1009.56" y="422.0426">created_by : uuid &#171;FK&#187;</text><line style="stroke:#181818;stroke-width:0.5;" x1="990.56" x2="1175.3207" y1="429.3444" y2="429.3444"/></g><g class="entity" data-entity="GMN12" data-source-line="60" data-uid="ent0013" id="entity_GMN12"><path d="M6,599.1269 L6,699.9238 A0,0 0 0 0 6,699.9238 L549.8818,699.9238 A0,0 0 0 0 549.8818,699.9238 L549.8818,609.1269 L539.8818,599.1269 L206.06,599.1269 L202.06,539.4569 L198.06,599.1269 L6,599.1269 A0,0 0 0 0 6,599.1269" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M539.8818,599.1269 L539.8818,609.1269 L549.8818,609.1269 L539.8818,599.1269" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="454.708" x="12" y="616.1938">Access token: JWT (HS256, 15 min) in cookie pt_access, never stored.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="436.7251" x="12" y="631.3266">Refresh token: opaque, 7 days, cookie pt_refresh (Path=/api/auth),</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="440.3687" x="12" y="646.4594">rotated on every use. Presenting an already rotated token after the</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="404.3965" x="12" y="661.5922">10 s grace window revokes the whole family (theft detection).</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="331.4238" x="12" y="676.725">Login/signup throttling lives in Redis, not Postgres:</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="514.6172" x="20.2646" y="691.8578">ratelimit:login:{username}  &#183;  ratelimit:login_ip:{ip}  &#183;  ratelimit:signup_ip:{ip}</text></g><!--link users to rt--><g class="link" data-entity-1="users" data-entity-2="rt" data-source-line="53" data-uid="lnk7" id="link_users_rt"><path codeLine="53" d="M647.5,192.6769 C647.5,243.3869 647.5,294.9269 647.5,294.9269 C647.5,294.9269 599.88,294.9269 523.94,294.9269" fill="none" id="users-rt" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="643.5" x2="651.5" y1="188.6769" y2="188.6769"/><line style="stroke:#181818;stroke-width:1;" x1="643.5" x2="651.5" y1="191.6769" y2="191.6769"/><line style="stroke:#181818;stroke-width:1;" x1="647.5" x2="647.5" y1="192.6769" y2="184.6769"/><line style="stroke:#181818;stroke-width:1;" x1="513.94" x2="505.94" y1="294.9269" y2="300.9269"/><line style="stroke:#181818;stroke-width:1;" x1="513.94" x2="505.94" y1="294.9269" y2="288.9269"/><line style="stroke:#181818;stroke-width:1;" x1="513.94" x2="505.94" y1="294.9269" y2="294.9269"/><ellipse cx="519.94" cy="294.9269" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="82.0054" x="548.84" y="290.9938">has sessions</text></g><!--link rt to rt--><g class="link" data-entity-1="rt" data-entity-2="rt" data-source-line="54" data-uid="lnk8" id="link_rt_rt"><path codeLine="54" d="M277.94,229.0969 C277.94,211.1069 277.94,213.9269 277.94,213.9269 C277.94,213.9269 527.73,213.9269 527.73,213.9269 C527.73,213.9269 527.73,568.9269 527.73,568.9269 C527.73,568.9269 353.82,568.9269 353.82,568.9269 C353.82,568.9269 353.82,571.9669 353.82,554.2769" fill="none" id="rt-rt" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="277.94" x2="277.94" y1="233.0969" y2="244.0969"/><ellipse cx="277.94" cy="233.0969" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="281.94" x2="273.94" y1="240.0969" y2="240.