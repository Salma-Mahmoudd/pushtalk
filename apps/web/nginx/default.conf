# Docker's DNS: "api" is looked up again when its container restarts with a new address,
# instead of once at start-up (which would leave nginx answering 502 until restarted).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api {
    zone api 64k;
    server api:8000 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    include /etc/nginx/snippets/security-headers.conf;

    # Refuses larger uploads before they reach the API (which enforces its own limit too).
    client_max_body_size 12m;

    # API: same origin for the browser, so cookies work and no CORS is needed.
    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets: upgrade the connection; keep quiet sockets open (clients ping every 25 s).
    location /ws/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Hashed build files never change, so browsers may keep them for a year.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Client-side routes (/channels/7, …) all load the app; index.html is always revalidated.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
