[project]
name = "pushtalk"
version = "0.1.0"
description = "PushTalk API: walkie-talkie voice channels (FastAPI, Celery workers)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "celery>=5.6.3",
    "fastapi>=0.143.0",
    "flower>=2.2.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "fakeredis[lua]>=2.39.0",
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]
# Speech to text; only the transcriber image installs it (the API image skips all groups).
transcribe = [
    # faster-whisper 1.2 opens audio with an argument PyAV 19 removed (metadata_errors).
    "av>=15,<19",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
]

[tool.uv]
# Local development gets every group, so tests and mypy see the transcriber's libraries.
default-groups = ["dev", "transcribe"]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # import order
  "UP",       # newer Python syntax
  "B",        # likely bugs
  "SIM",      # simplifications
  "ASYNC",    # blocking calls in async code
  "RUF",      # ruff-specific checks
]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "migrations"]

[[tool.mypy.overrides]]
# Ships without type information.
module = ["faster_whisper", "faster_whisper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = ["integration: needs PostgreSQL and Redis running (docker-compose.dev.yml)"]
