<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PushTalk — Walkie-talkie voice channels</title>
    <meta
      name="description"
      content="Hold to talk, release to send. PushTalk is walkie-talkie style voice chat: short voice messages that play automatically, in order, for everyone in the channel."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

    <script>
      // Apply the saved theme before the first paint, so dark mode does not flash white.
      try {
        const theme = localStorage.getItem('theme') ?? 'system'
        const dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch {}
    </script>

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PushTalk" />
    <meta property="og:title" content="PushTalk — Walkie-talkie voice channels" />
    <meta
      property="og:description"
      content="Hold to talk, release to send. Voice messages play automatically, in order, for everyone in the channel."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PushTalk logo with the text: Walkie-talkie voice channels. Hold to talk. Release to send." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PushTalk — Walkie-talkie voice channels" />
    <meta
      name="twitter:description"
      content="Hold to talk, release to send. Voice messages play automatically, in order, for everyone in the channel."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta name="twitter:image:alt" content="PushTalk logo with the text: Walkie-talkie voice channels. Hold to talk. Release to send." />
  </head>
  <body>
    <noscript>PushTalk needs JavaScript to record and play voice messages.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
