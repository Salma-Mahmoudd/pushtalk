# Development additions, used together with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Publishes the services on localhost only and reloads the API on code changes.
services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"

  api:
    # Source mounted over the image's copy; uvicorn restarts on every change.
    command: ["uvicorn", "pushtalk.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/src"]
    volumes:
      - ./apps/api/src:/app/src:ro
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8001}:8000"
