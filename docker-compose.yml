name: pushtalk

# Shared by the API image's services (api, worker, flower, migrate): build and settings.
x-api: &api
  build:
    context: ./apps/api
    target: api
  image: pushtalk-api
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pushtalk}:${POSTGRES_PASSWORD:-pushtalk}@postgres:5432/${POSTGRES_DB:-pushtalk}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    MEDIA_DIR: /data/media
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    LOG_FORMAT: ${LOG_FORMAT:-json}
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:5173}
    JWT_SECRET: ${JWT_SECRET:-dev-insecure-change-me-local-development-only}
    COOKIE_SECURE: ${COOKIE_SECURE:-true}
    TRANSCRIBE_PROVIDER: ${TRANSCRIBE_PROVIDER:-local}
    WHISPER_MODEL: ${WHISPER_MODEL:-base}
    WHISPER_MODEL_DIR: /models
    TRANSCRIBE_LANGUAGE: ${TRANSCRIBE_LANGUAGE:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-gpt-4o-mini-transcribe}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pushtalk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pushtalk}
      POSTGRES_DB: ${POSTGRES_DB:-pushtalk}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Append-only file: queued Celery tasks survive a restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-off job: applies database migrations, then exits; the API waits for it to succeed.
  migrate:
    <<: *api
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api
    volumes:
      - media:/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # Fails unless GET /api/health answers 200 (database and Redis reachable).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  # Processes voice messages (ffmpeg) from the "audio" queue.
  worker:
    <<: *api
    command: ["celery", "-A", "pushtalk.worker.celery_app", "worker", "-Q", "audio", "--concurrency", "2", "--loglevel", "INFO"]
    volumes:
      - media:/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Speech to text for ready messages, from the "transcribe" queue (one at a time: CPU heavy).
  transcriber:
    <<: *api
    build:
      context: ./apps/api
      target: transcriber
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-base}
    image: pushtalk-transcriber
    command: ["celery", "-A", "pushtalk.worker.celery_app", "worker", "-Q", "transcribe", "--concurrency", "1", "--loglevel", "INFO"]
    volumes:
      - media:/data/media:ro
      # Starts as a copy of the image's /models (the base model); other sizes are added here.
      - whisper-models:/models
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Celery dashboard: tasks, retries, failures. Localhost only, behind basic auth.
  flower:
    <<: *api
    command: ["celery", "-A", "pushtalk.worker.celery_app", "flower", "--port=5555"]
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:-admin:pushtalk-dev}
    ports:
      - "127.0.0.1:${FLOWER_PORT:-5555}:5555"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./apps/web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  media:
  whisper-models:
